<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">服务治理与链路追踪体系</text>
  
  <!-- Left: Service Governance -->
  <rect x="30" y="45" width="200" height="30" rx="4" fill="url(#g1)"/>
  <text x="130" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">服务治理 (Service Governance)</text>
  
  <!-- etcd -->
  <rect x="50" y="90" width="160" height="50" rx="5" fill="#a8edea" filter="url(#s)"/>
  <text x="130" y="110" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">etcd</text>
  <text x="130" y="125" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">服务注册与发现</text>
  
  <!-- Service List -->
  <rect x="50" y="155" width="160" height="60" rx="5" fill="white" stroke="#e2e8f0"/>
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">微服务</text>
  <text x="130" y="185" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">User | Video | Interact</text>
  <text x="130" y="198" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Socialize | WebSocket</text>
  
  <!-- Kitex RPC -->
  <rect x="50" y="230" width="160" height="40" rx="5" fill="url(#g3)" filter="url(#s)"/>
  <text x="130" y="250" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Kitex RPC 通信</text>
  
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">服务间通过 RPC 互相调用</text>
  
  <!-- Middle: Tracing Flow -->
  <rect x="260" y="45" width="280" height="30" rx="4" fill="url(#g2)"/>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">分布式链路追踪 (Distributed Tracing)</text>
  
  <!-- Request Flow -->
  <rect x="280" y="90" width="100" height="35" rx="4" fill="url(#g1)" filter="url(#s)"/>
  <text x="330" y="108" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Gateway</text>
  <text x="330" y="120" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">HTTP Request</text>
  
  <line x1="380" y1="107" x2="400" y2="107" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <polygon points="400,107 395,102 395,112" fill="#94a3b8"/>
  
  <!-- Service 1 -->
  <rect x="410" y="90" width="100" height="35" rx="4" fill="url(#g3)" filter="url(#s)"/>
  <text x="460" y="108" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Service A</text>
  <text x="460" y="120" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">RPC Call</text>
  
  <!-- Arrow down -->
  <line x1="460" y1="125" x2="460" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <polygon points="460,145 455,140 465,140" fill="#94a3b8"/>
  
  <!-- Service 2 -->
  <rect x="410" y="155" width="100" height="35" rx="4" fill="url(#g4)" filter="url(#s)"/>
  <text x="460" y="173" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Service B</text>
  <text x="460" y="185" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">DB/Cache</text>
  
  <!-- Trace Context -->
  <rect x="280" y="205" width="240" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#92400e" text-anchor="middle">Trace Context 传递</text>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="8" fill="#b45309" text-anchor="middle">trace_id | span_id | parent_id</text>
  <text x="400" y="248" font-family="Arial, sans-serif" font-size="8" fill="#b45309" text-anchor="middle">通过 HTTP Header / RPC Meta 传递</text>
  
  <!-- Right: Observability -->
  <rect x="570" y="45" width="200" height="30" rx="4" fill="url(#g4)"/>
  <text x="670" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">可观测性平台 (Observability)</text>
  
  <!-- OTel Collector -->
  <rect x="590" y="90" width="160" height="45" rx="5" fill="#6366f1" filter="url(#s)"/>
  <text x="670" y="110" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">OTel Collector</text>
  <text x="670" y="125" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">统一收集 Trace/Metric</text>
  
  <!-- Jaeger -->
  <rect x="590" y="150" width="75" height="45" rx="5" fill="#a8edea" filter="url(#s)"/>
  <text x="627.5" y="168" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">Jaeger</text>
  <text x="627.5" y="182" font-family="Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">Trace 存储</text>
  
  <!-- Prometheus -->
  <rect x="675" y="150" width="75" height="45" rx="5" fill="#eab308" filter="url(#s)"/>
  <text x="712.5" y="168" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Prometheus</text>
  <text x="712.5" y="182" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Metric 存储</text>
  
  <!-- Grafana -->
  <rect x="590" y="210" width="160" height="45" rx="5" fill="#f97316" filter="url(#s)"/>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Grafana</text>
  <text x="670" y="245" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">可视化 Dashboard</text>
  
  <!-- VictoriaMetrics -->
  <rect x="590" y="270" width="160" height="40" rx="5" fill="#22c55e" filter="url(#s)"/>
  <text x="670" y="288" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">VictoriaMetrics</text>
  <text x="670" y="302" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">时序数据库</text>
  
  <!-- Arrows -->
  <line x1="130" y1="140" x2="130" y2="155" stroke="#94a3b8" stroke-width="1"/>
  <line x1="130" y1="215" x2="280" y2="215" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>
  <line x1="460" y1="190" x2="590" y2="190" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>
  <line x1="670" y1="135" x2="670" y2="150" stroke="#94a3b8" stroke-width="1"/>
  <line x1="627.5" y1="195" x2="627.5" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="712.5" y1="195" x2="712.5" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="670" y1="255" x2="670" y2="270" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Legend -->
  <rect x="50" y="320" width="700" height="60" rx="5" fill="white" stroke="#e2e8f0"/>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">工作流程</text>
  <text x="130" y="360" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">1. 服务启动注册到 etcd</text>
  <text x="330" y="360" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">2. 请求携带 TraceId 入站</text>
  <text x="530" y="360" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">3. 服务间调用传递 TraceId</text>
  <text x="710" y="360" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">4. 数据上报 OTel 分析</text>

</svg>