<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="500" height="320" fill="#f8fafc"/>
  
  <text x="250" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">TikTok 系统架构</text>
  
  <!-- Gateway -->
  <rect x="20" y="35" width="460" height="45" rx="5" fill="url(#g1)"/>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Hertz API Gateway</text>
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">HTTP / WebSocket | Auth | Token | Router</text>
  
  <!-- Services -->
  <rect x="30" y="100" width="65" height="50" rx="4" fill="url(#g2)" filter="url(#s)"/>
  <text x="62.5" y="120" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">User</text>
  <text x="62.5" y="135" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Service</text>

  <rect x="108" y="100" width="65" height="50" rx="4" fill="url(#g3)" filter="url(#s)"/>
  <text x="140.5" y="120" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Video</text>
  <text x="140.5" y="135" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Service</text>

  <rect x="186" y="100" width="65" height="50" rx="4" fill="url(#g4)" filter="url(#s)"/>
  <text x="218.5" y="120" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Interact</text>
  <text x="218.5" y="135" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Service</text>

  <rect x="264" y="100" width="65" height="50" rx="4" fill="#f97316" filter="url(#s)"/>
  <text x="296.5" y="120" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Socialize</text>
  <text x="296.5" y="135" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Service</text>

  <rect x="342" y="100" width="65" height="50" rx="4" fill="#6366f1" filter="url(#s)"/>
  <text x="374.5" y="120" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">WebSocket</text>
  <text x="374.5" y="135" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Service</text>

  <!-- etcd -->
  <rect x="420" y="100" width="50" height="50" rx="4" fill="#a8edea"/>
  <text x="445" y="120" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#334155" text-anchor="middle">etcd</text>
  <text x="445" y="135" font-family="Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">Registry</text>

  <!-- Data Layer -->
  <rect x="30" y="170" width="70" height="45" rx="4" fill="url(#g1)" filter="url(#s)"/>
  <text x="65" y="188" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">MySQL</text>
  <text x="65" y="202" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">User/Video</text>

  <rect x="113" y="170" width="70" height="45" rx="4" fill="url(#g2)" filter="url(#s)"/>
  <text x="148" y="188" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Redis</text>
  <text x="148" y="202" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Cache</text>

  <rect x="196" y="170" width="70" height="45" rx="4" fill="url(#g3)" filter="url(#s)"/>
  <text x="231" y="188" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">OSS</text>
  <text x="231" y="202" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Storage</text>

  <rect x="279" y="170" width="70" height="45" rx="4" fill="url(#g4)" filter="url(#s)"/>
  <text x="314" y="188" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Kafka</text>
  <text x="314" y="202" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Queue</text>

  <!-- Observability -->
  <rect x="362" y="170" width="108" height="45" rx="4" fill="#6366f1" filter="url(#s)"/>
  <text x="416" y="185" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">OTel + Jaeger</text>
  <text x="416" y="200" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Tracing</text>

  <!-- Infrastructure -->
  <rect x="30" y="235" width="440" height="35" rx="4" fill="#e2e8f0"/>
  <text x="250" y="252" font-family="Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Prometheus | Grafana | VictoriaMetrics | Node/Redis/MySQL Exporter</text>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Monitoring and Observability</text>

  <!-- Arrows -->
  <line x1="250" y1="80" x2="62.5" y2="100" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="80" x2="140.5" y2="100" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="80" x2="218.5" y2="100" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="80" x2="296.5" y2="100" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="80" x2="374.5" y2="100" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="80" x2="445" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>

  <line x1="62.5" y1="150" x2="65" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="62.5" y1="150" x2="148" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="140.5" y1="150" x2="65" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="140.5" y1="150" x2="148" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="140.5" y1="150" x2="231" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="218.5" y1="150" x2="148" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="218.5" y1="150" x2="314" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="374.5" y1="150" x2="65" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="374.5" y1="150" x2="148" y2="170" stroke="#94a3b8" stroke-width="1"/>

</svg>